server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Charset
    charset utf-8;

    # Maximum upload/body size
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------
    # Rutas amigables para las 3 herramientas de i2 Services
    # -------------------------------------------------------------

    # 1. Herramienta 1: Generador de Firmas Institucionales
    location = /firmas {
        return 301 /firmas/;
    }
    location = /generador-firmas {
        return 301 /email-signatures/generador-firmas.html;
    }

    # 2. Herramienta 2: Generador de Vacantes
    location = /vacantes {
        return 301 /vacantes/;
    }
    location = /generador-vacantes {
        return 301 /generador-vacantes.html;
    }

    # Cache de activos estáticos (Vite bundles, fuentes, imágenes, videos)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|jpg|jpeg|png|webp|svg|gif|mp4|webm|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 3. Herramienta 3 / Base: Sitio Web Corporativo (SPA Fallback)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Manejo de errores
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
